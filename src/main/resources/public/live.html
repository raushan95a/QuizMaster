<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuizMaster Live</title>
    <style>
        :root {
            --bg: #f5f7fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
            --primary: #2563eb; --good: #16a34a; --bad: #dc2626; --bar: #dbeafe; --flash: #fef9c3;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --line: #334155;
                --primary: #60a5fa; --good: #4ade80; --bad: #f87171; --bar: #1e3a5f; --flash: #3f3a12;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg);
               color: var(--text); padding: 16px; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        header { margin-bottom: 16px; }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
        .brand { color: var(--primary); font-weight: 800; letter-spacing: .5px; }
        h1 { font-size: clamp(22px, 4vw, 36px); margin: 0; overflow-wrap: anywhere; }
        .status { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
        .live .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(22,163,74,.2); }
        .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
        .grid > *, .stat { min-width: 0; }
        .table-scroll { overflow-x: auto; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .stats { gap: 8px; }
            .stat { padding: 12px; }
            .stat .n { font-size: 24px; }
            .stat .l { font-size: 12px; }
            th, td { padding: 8px 4px; }
        }
        .stat, .card { background: var(--card); border-radius: 12px; padding: 16px;
                       box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .stat .n { font-size: 32px; font-weight: 800; }
        .stat .l { color: var(--muted); font-size: 14px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
        h2 { font-size: 18px; margin: 0 0 12px; }
        table { width: 100%; border-collapse: collapse; font-size: clamp(15px, 2vw, 18px); }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 600; font-size: 14px; }
        td.rank { font-weight: 800; width: 48px; }
        tr.flash td { animation: flash 1.6s ease-out; }
        @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
        .writer { margin-bottom: 12px; }
        .writer .name { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; }
        .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
        .bar span { display: block; height: 100%; background: var(--primary); transition: width .4s; }
        .empty { color: var(--muted); }
        .quiz-list a { display: block; padding: 14px 16px; margin-bottom: 10px; border-radius: 10px;
                       background: var(--card); color: var(--text); text-decoration: none;
                       box-shadow: 0 2px 10px rgba(0,0,0,.06); font-size: 18px; }
        .quiz-list a:hover { outline: 2px solid var(--primary); }
        .error { color: var(--bad); }
        footer { color: var(--muted); font-size: 13px; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="top">
            <span class="brand">QuizMaster LIVE</span>
            <span class="status" id="status"><span class="dot"></span><span id="statusText">Connecting...</span></span>
        </div>
        <h1 id="title">Loading...</h1>
    </header>

    <div id="chooser" class="quiz-list" hidden></div>

    <div id="board" hidden>
        <div class="stats">
            <div class="stat"><div class="n" id="writingCount">0</div><div class="l">writing now</div></div>
            <div class="stat"><div class="n" id="submittedCount">0</div><div class="l">submitted</div></div>
            <div class="stat"><div class="n" id="topScore">-</div><div class="l">top score</div></div>
        </div>
        <div class="grid">
            <section class="card">
                <h2>🏆 Leaderboard</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Time</th></tr></thead>
                        <tbody id="leaderboard"></tbody>
                    </table>
                </div>
                <p class="empty" id="noLeaders">No submissions yet.</p>
            </section>
            <section class="card">
                <h2>✍️ Writing now</h2>
                <div id="writing"></div>
                <p class="empty" id="noWriters">Nobody is writing right now.</p>
            </section>
        </div>
    </div>
    <footer id="updated"></footer>
</div>

<script>
    const quizId = new URLSearchParams(location.search).get("quiz");
    const $ = (id) => document.getElementById(id);
    let previousRows = new Set();

    function setStatus(live, text) {
        $("status").classList.toggle("live", live);
        $("statusText").textContent = text;
    }

    function time(sec) {
        return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
    }

    // Build elements with textContent (never innerHTML) so names can't inject HTML
    function cell(text, cls) {
        const td = document.createElement("td");
        td.textContent = text;
        if (cls) td.className = cls;
        return td;
    }

    function render(state) {
        $("title").textContent = state.quizTitle;
        document.title = state.quizTitle + " - QuizMaster Live";
        $("writingCount").textContent = state.writing.length;
        $("submittedCount").textContent = state.submittedCount;
        $("topScore").textContent = state.leaderboard.length
            ? state.leaderboard[0].score + "/" + state.leaderboard[0].total : "-";

        const body = $("leaderboard");
        body.replaceChildren();
        const rows = new Set();
        for (const e of state.leaderboard) {
            const key = e.name + "|" + e.score + "|" + e.timeTakenSec;
            rows.add(key);
            const tr = document.createElement("tr");
            if (previousRows.size && !previousRows.has(key)) tr.className = "flash"; // new or changed row
            tr.append(cell(e.rank, "rank"), cell(e.name), cell(e.score + " / " + e.total), cell(time(e.timeTakenSec)));
            body.append(tr);
        }
        previousRows = rows.size ? rows : new Set(["-"]);
        $("noLeaders").hidden = state.leaderboard.length > 0;

        const writing = $("writing");
        writing.replaceChildren();
        for (const w of state.writing) {
            const box = document.createElement("div");
            box.className = "writer";
            const line = document.createElement("div");
            line.className = "name";
            const n = document.createElement("span");
            n.textContent = w.name;
            const c = document.createElement("span");
            c.textContent = w.answered + " / " + state.totalQuestions;
            line.append(n, c);
            const bar = document.createElement("div");
            bar.className = "bar";
            const fill = document.createElement("span");
            fill.style.width = (state.totalQuestions ? 100 * w.answered / state.totalQuestions : 0) + "%";
            bar.append(fill);
            box.append(line, bar);
            writing.append(box);
        }
        $("noWriters").hidden = state.writing.length > 0;
        $("updated").textContent = "Last update " + new Date(state.updatedAt).toLocaleTimeString();
        $("board").hidden = false;
    }

    function connect() {
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(protocol + "://" + location.host + "/ws/live?quiz=" + encodeURIComponent(quizId));
        socket.onopen = () => setStatus(true, "Live");
        socket.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.error) {
                $("title").textContent = data.error;
                $("title").className = "error";
                return;
            }
            render(data);
        };
        socket.onclose = () => {
            setStatus(false, "Reconnecting...");
            setTimeout(connect, 3000); // try again every 3 seconds
        };
    }

    async function showChooser() {
        $("title").textContent = "Choose a quiz";
        setStatus(false, "");
        const list = $("chooser");
        list.hidden = false;
        try {
            const quizzes = await (await fetch("/api/live")).json();
            if (!quizzes.length) list.textContent = "No published quizzes yet.";
            for (const q of quizzes) {
                const a = document.createElement("a");
                a.href = "?quiz=" + q.id;
                a.textContent = q.title;
                list.append(a);
            }
        } catch (e) {
            list.textContent = "Cannot reach the server.";
        }
    }

    /** First picture straight away over normal HTTP, then live updates over WebSocket. */
    async function start() {
        try {
            const res = await fetch("/api/live/" + encodeURIComponent(quizId));
            const data = await res.json();
            if (data.error) {
                $("title").textContent = data.error;
                $("title").className = "error";
            } else {
                render(data);
            }
        } catch (e) {
            // the WebSocket below will keep retrying
        }
        connect();
    }

    if (quizId) start(); else showChooser();
</script>
</body>
</html>
